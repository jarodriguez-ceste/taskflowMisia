services:
  jenkins:
    build: .
    container_name: jenkins
    # root solo en clase: acceso al Docker del equipo
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
